name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python 骨架检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      # 骨架阶段只装服务与测试所需的最小依赖，保证无 torch 也能通过
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt || \
              pip install fastapi uvicorn httpx pytest python-multipart openpyxl pandas
          else
            pip install fastapi uvicorn httpx pytest python-multipart openpyxl pandas
          fi

      - name: 校验 Python 模块可导入
        run: python -c "import src.inference.app; print('import ok')"

      - name: 运行测试
        run: python -m pytest tests/ -q

  frontend:
    name: 前端构建检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: 安装依赖
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: 构建
        run: npm run build

      - name: 校验构建产物
        run: test -f dist/index.html && echo "dist/index.html 存在"
