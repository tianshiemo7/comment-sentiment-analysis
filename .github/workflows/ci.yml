name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python 服务与数据处理检查
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      # 先按 requirements.txt 装全量依赖；失败时**显式告警**再降级到最小集，
      # 避免"装失败也绿"掩盖 requirements.txt 不可安装的问题。
      - name: 安装依赖（requirements.txt 优先）
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ] && pip install -r requirements.txt; then
            echo "已按 requirements.txt 安装全部依赖"
          else
            echo "::warning title=requirements.txt 安装失败::已降级为最小依赖集，绿色 CI 不代表 requirements.txt 可安装"
            pip install fastapi uvicorn httpx pytest python-multipart openpyxl pandas jieba numpy
          fi

      - name: 校验 Python 模块可导入
        run: |
          python -c "import src.inference.app; print('inference ok')"
          python -c "import src.videos.service; print('videos ok')"
          python -c "import src.preprocessing; print('preprocessing ok')"
          python -c "import src.crawler; print('crawler ok')"
          python -c "import src.models.cnn, src.models.bilstm_attention; print('models ok')"
          python -c "import src.training.cli, src.training.trainer; print('training ok')"
          python -c "import src.evaluation.metrics, src.evaluation.report; print('evaluation ok')"
          python -c "import src.visualization; print('visualization ok')"
          python -c "import src.embeddings, src.embeddings.__main__; print('embeddings ok')"

      # 爬虫与预处理没有独立测试覆盖时，至少保证模块可编译、可导入、CLI 可 --help
      - name: 校验爬虫与训练/词向量 CLI（防语法/依赖回归）
        run: |
          python -m py_compile src/crawler/*.py
          python -c "import ast,sys; ast.parse(open('src/crawler/bilibili.py',encoding='utf-8').read()); print('bilibili.py 语法 ok')"
          python -m src.crawler --help > /dev/null && echo "爬虫总入口 --help ok"
          python -m src.crawler.bilibili --help > /dev/null && echo "B站爬虫 CLI --help ok"
          python -m src.crawler.spider --help > /dev/null && echo "通用 HTML 爬虫 CLI --help ok"
          python -m src.training.cli --help > /dev/null && echo "训练 CLI --help ok"
          python -m src.embeddings --help > /dev/null && echo "词向量 CLI --help ok"

      - name: 运行测试
        run: python -m pytest tests/ -q

  frontend:
    name: 前端构建检查
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: 构建
        run: npm run build

      - name: 校验构建产物
        run: |
          test -f dist/index.html && echo "dist/index.html 存在"
          test -n "$(ls dist/assets/*.js 2>/dev/null)" && echo "构建产物 JS 存在"